[package]
name = "spine-rules"
version = "0.3.1"
edition = "2024"
description = "Shared golden-rules enforcement for CMD+RVL spine tools"
license = "MIT"
repository = "https://github.com/cmdrvl/spine-rules"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
keywords = ["spine", "testing", "golden-rules", "cli"]
categories = ["development-tools::testing"]

[dependencies]
blake3 = "1.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
